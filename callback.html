<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekon — Conectando...</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:#F7F6F2;color:#1A1916;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #E4E2D9;border-radius:16px;padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{width:48px;height:48px;background:#FFE600;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 20px;box-shadow:0 2px 12px rgba(255,230,0,.4)}
h1{font-size:20px;font-weight:700;margin-bottom:8px}
.sub{font-size:13px;color:#8A8780;line-height:1.5}
.spinner{width:36px;height:36px;border:3px solid #E4E2D9;border-top-color:#FFE600;border-radius:50%;animation:spin 0.8s linear infinite;margin:28px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:12px;color:#8A8780;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡</div>
  <h1>Conectando tu cuenta...</h1>
  <p class="sub">Verificando acceso con Mercado Libre. No cierres esta ventana.</p>
  <div class="spinner"></div>
  <div class="status" id="status">Procesando autorización...</div>
</div>

<script>
const EDGE_FUNCTION = 'https://jftplkcoqxzkkhvuwemj.supabase.co/functions/v1/bright-worker';

const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');

if (error) {
  window.location.href = '/index.html?error=' + error;
} else if (code) {
  // Redirigir a la Edge Function con el código
  window.location.href = EDGE_FUNCTION + '?code=' + code;
} else {
  window.location.href = '/index.html?error=no_code';
}
</script>
</body>
</html>
