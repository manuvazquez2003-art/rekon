<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekon — Conectando...</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:#F7F6F2;color:#1A1916;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #E4E2D9;border-radius:16px;padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{width:48px;height:48px;background:#FFE600;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 20px;box-shadow:0 2px 12px rgba(255,230,0,.4)}
h1{font-size:20px;font-weight:700;margin-bottom:8px}
.sub{font-size:13px;color:#8A8780;line-height:1.5}
.spinner{width:36px;height:36px;border:3px solid #E4E2D9;border-top-color:#FFE600;border-radius:50%;animation:spin 0.8s linear infinite;margin:28px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:12px;color:#8A8780;margin-top:16px}
.error{background:#FDF0EE;border:1px solid #F0C4BF;border-radius:10px;padding:16px;margin-top:20px;font-size:12px;color:#C0392B;line-height:1.5;display:none}
.btn{display:inline-block;margin-top:20px;padding:10px 20px;background:#FFE600;border:none;border-radius:8px;font-size:13px;font-weight:700;color:#1A1916;cursor:pointer;font-family:'Sora',sans-serif;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡</div>
  <h1 id="title">Conectando tu cuenta...</h1>
  <p class="sub" id="sub">Estamos verificando tu acceso con Mercado Libre. No cierres esta ventana.</p>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Verificando permisos...</div>
  <div class="error" id="error"></div>
</div>

<script>
const SUPABASE_URL = 'https://jftplkcoqxzkkhvuwemj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmdHBsa2NvcXh6a2todnV3ZW1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTM3MDEsImV4cCI6MjA5MzU2OTcwMX0.jE0x7KiaWdfejsys77i-dADW4GQXmh5mBSQh0diFeO0';

// IMPORTANTE: el intercambio de código por token requiere el SECRET KEY
// Esto NO puede hacerse desde el frontend por seguridad
// Necesita un backend (n8n o Edge Function de Supabase)
// Por ahora mostramos el código para que lo procese n8n

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error) {
    showError(`Mercado Libre devolvió un error: ${error}`);
    return;
  }

  if (!code) {
    showError('No se recibió el código de autorización. Volvé a intentarlo.');
    return;
  }

  setStatus('Código recibido. Guardando en sistema...');

  // Guardamos el código temporalmente en Supabase
  // n8n lo va a interceptar, intercambiar por token, y actualizar el registro
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/sellers`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        ml_user_id: 'pending_' + Date.now(),
        access_token: 'pending',
        refresh_token: code, // temporal — n8n lo reemplaza
        plan: 'pro',
        activo: false // se activa cuando n8n complete el intercambio
      })
    });

    if (!res.ok) throw new Error(await res.text());

    setStatus('¡Listo! Redirigiendo al panel...');
    document.getElementById('title').textContent = '¡Cuenta conectada!';
    document.getElementById('sub').textContent = 'Tu cuenta de Mercado Libre fue vinculada correctamente a Rekon.';
    document.getElementById('spinner').style.display = 'none';

    setTimeout(() => {
      window.location.href = '/rekon.html';
    }, 2000);

  } catch(e) {
    showError('Error al guardar la conexión. Contactá soporte: ' + e.message);
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function showError(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('title').textContent = 'Algo salió mal';
  document.getElementById('sub').textContent = '';
  const err = document.getElementById('error');
  err.style.display = 'block';
  err.innerHTML = msg + '<br><br><a href="/index.html" class="btn">Volver a intentar</a>';
}

handleCallback();
</script>
</body>
</html>
